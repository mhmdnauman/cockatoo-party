<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#f97316"/>

  <!-- Crest feathers -->
  <line x1="32" y1="18" x2="28" y2="6"  stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="32" y1="18" x2="32" y2="4"  stroke="#fef08a" stroke-width="3"   stroke-linecap="round"/>
  <line x1="32" y1="18" x2="36" y2="6"  stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="28" cy="6"  r="2.2" fill="#fbbf24"/>
  <circle cx="32" cy="4"  r="2.8" fill="#fef08a"/>
  <circle cx="36" cy="6"  r="2.2" fill="#fbbf24"/>

  <!-- Body -->
  <ellipse cx="32" cy="44" rx="13" ry="15" fill="white" opacity="0.95"/>

  <!-- Head -->
  <circle cx="32" cy="26" r="10" fill="white" opacity="0.95"/>

  <!-- Cheek patch -->
  <ellipse cx="27" cy="29" rx="4" ry="3" fill="#fbbf24" opacity="0.9"/>

  <!-- Eye -->
  <circle cx="35" cy="24" r="2.5" fill="#1a1a1a"/>
  <circle cx="36" cy="23" r="0.8" fill="white"/>

  <!-- Beak -->
  <path d="M29 30 Q32 36 35 30 Q32 32 29 30Z" fill="#f59e0b"/>

  <!-- Wing hint -->
  <ellipse cx="22" cy="44" rx="6" ry="10" fill="#f0ede0" transform="rotate(-10 22 44)"/>
  <ellipse cx="42" cy="44" rx="6" ry="10" fill="#f0ede0" transform="rotate(10 42 44)"/>
</svg>
